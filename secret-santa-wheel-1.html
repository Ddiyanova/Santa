<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wheel of Friends 1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 30% 20%,#2b3550,#1a1625 70%);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 40px}
h1{font-size:26px;margin:4px 0 14px;letter-spacing:.5px}
.wrap{position:relative;width:min(92vw,440px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.ptr{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:16px solid transparent;border-bottom:16px solid transparent;border-right:30px solid #fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.hub{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:none;font-weight:700;font-size:15px;color:#2b3550;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hint{opacity:.7;font-size:14px;margin:14px 0 6px}
.list{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;max-width:460px}
.ent{position:relative;width:76px;text-align:center}
.ent img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.25)}
.ent.off img{opacity:.3;filter:grayscale(1)}
.ent input{width:100%;margin-top:4px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.3);color:#fff;text-align:center;font-size:13px;padding:2px}
.ent .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:#e5484d;color:#fff;font-size:13px;cursor:pointer}
.add{width:76px;height:76px;border-radius:12px;border:2px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;color:rgba(255,255,255,.7)}
.res{margin-top:18px;font-size:14px;opacity:.85;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9}
.modal.show{display:flex}
.card{background:#25223a;border-radius:20px;padding:22px;text-align:center;width:min(86vw,340px);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.card img{width:100%;max-height:50vh;object-fit:cover;border-radius:14px}
.card h2{margin:14px 0 16px;font-size:24px}
.btns{display:flex;gap:10px;justify-content:center}
.btns button{flex:1;padding:12px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer}
.b1{background:#5b6cf0;color:#fff}.b2{background:#3a3655;color:#fff}
.gift .ent .x,.gift .add,.gift #remove{display:none}</style></head><body>
<h1>🎁 Secret Santa Wheel</h1>
<div class="wrap"><canvas id="c" width="900" height="900"></canvas><div class="ptr"></div><button class="hub" id="spin">SPIN</button></div>
<div class="hint">Tap SPIN or the wheel · tap a name to edit it</div>
<div class="list" id="list"></div>
<div class="res" id="res"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<div class="modal" id="modal"><div class="card"><img id="wimg" alt=""><h2 id="wname">🎉</h2>
<div class="btns"><button class="b2" id="remove">Remove</button><button class="b1" id="close">Spin again</button></div></div></div>

   const iw=e.img.naturalWidth,ih=e.img.naturalHeight,k=n>=3?1:1.4,w=R*(e.w||1.3)*k*(3/Math.max(3,n))**0.5,h=ih*w/iw;
   ctx.drawImage(e.img,cx-(e.fx||.5)*w,cy-(e.fy||.35)*h,w,h);
  }
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(C,C);ctx.lineTo(C+R*Math.cos(a0),C+R*Math.sin(a0));ctx.stroke();
 });
 ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=8;ctx.beginPath();ctx.arc(C,C,R,0,7);ctx.stroke();
}
function list(){
 const L=document.getElementById('list');L.innerHTML='';
 entries.forEach((e,i)=>{const d=document.createElement('div');d.className='ent'+(e.on?'':' off');
  d.innerHTML=`<img src="${e.src}"><input placeholder="Name ${i+1}" value="${e.name.replace(/"/g,'&quot;')}"><button class="x" title="Toggle">${e.on?'✕':'↺'}</button>`;
  d.querySelector('input').oninput=ev=>{e.name=ev.target.value;draw();save()};
  d.querySelector('.x').onclick=()=>{e.on=!e.on;draw();list()};
  L.appendChild(d)});
 const add=document.createElement('div');add.className='add';add.textContent='+';add.title='Add photo';add.onclick=()=>document.getElementById('file').click();L.appendChild(add);
 document.getElementById('res').textContent=history.length?'Results: '+history.map((h,i)=>h||'?').join(' → '):'';
}
document.getElementById('file').onchange=ev=>{[...ev.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{entries.push({src:r.result,bg:r.result,fx:.5,fy:.35,w:1.3,name:'',on:true});draw();list()};r.readAsDataURL(f)});ev.target.value=''};
let actx;function tick(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=900;g.gain.setValueAtTime(.06,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.04);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.05)}catch(e){}}
function spin(){
 const a=active();if(spinning||a.length<1)return;spinning=true;tick();
 const start=rot;let total=Math.PI*2*(5+Math.random()*3)+Math.random()*Math.PI*2;
 if(GK>=0){const j=(GK/13)-7,s2=2*Math.PI/a.length,fin=-(j+0.2+Math.random()*0.6)*s2;const cur=((start%(2*Math.PI))+2*Math.PI)%(2*Math.PI),tgt=((fin%(2*Math.PI))+2*Math.PI)%(2*Math.PI);total=Math.PI*2*(5+Math.floor(Math.random()*3))+((tgt-cur+2*Math.PI)%(2*Math.PI))}
 const dur=5000+Math.random()*1500,t0=performance.now();
 const step=2*Math.PI/a.length;let last=-1;
 (function f(t){const p=Math.min(1,(t-t0)/dur),ease=1-Math.pow(1-p,4);rot=start+total*ease;draw();
  const idx=Math.floor((((-rot)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/step);if(idx!==last){last=idx;tick()}
  if(p<1)requestAnimationFrame(f);else{spinning=false;show(a[idx])}})(t0);
}
let winner;
function show(e){winner=e;document.getElementById('wimg').src=e.src;document.getElementById('wname').textContent=e.name?`🎉 ${e.name}!`:'🎉 The wheel has chosen!';history.push(e.name);list();document.getElementById('modal').classList.add('show')}
document.getElementById('close').onclick=()=>{document.getElementById('modal').classList.remove('show');spin()};
document.getElementById('remove').onclick=()=>{winner.on=false;document.getElementById('modal').classList.remove('show');draw();list()};
document.getElementById('modal').onclick=ev=>{if(ev.target.id==='modal')ev.target.classList.remove('show')};
document.getElementById('spin').onclick=spin;cv.onclick=spin;
function save(){try{localStorage.setItem(KEY,JSON.stringify(entries.slice(0,IMGS.length).map(e=>e.name)))}catch(e){}}
try{const n=JSON.parse(localStorage.getItem(KEY)||'[]');n.forEach((v,i)=>{if(entries[i]&&v)entries[i].name=v})}catch(e){}
if(GK>=0)document.body.classList.add('gift');entries.forEach(load);draw();list();
</script></body></html>
